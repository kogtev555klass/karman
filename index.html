<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111616">
  <meta name="description" content="Карман — учёт денег на устройстве.">
  <title>Карман — учёт денег</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="workspace">
    <aside class="sidebar">
      <a class="brand" href="./" aria-label="Карман, начальный экран">
        <img src="./icon-192.png" alt="" width="37" height="37"><span>Карман</span>
      </a>
      <nav class="navigation" aria-label="Разделы">
        <button type="button" class="nav-button" id="show-journal" aria-current="page">
          <span class="icon icon-journal" aria-hidden="true"></span> Операции
        </button>
        <button type="button" class="nav-button" id="show-accounts">
          <span class="icon icon-wallet" aria-hidden="true"></span> Счета
        </button>
      </nav>
      <p class="store-status" id="offline-status"><span></span> Данные на устройстве</p>
    </aside>

    <main class="main">
      <p class="message page-message" id="page-message" role="alert" hidden></p>
      <section id="journal" aria-labelledby="journal-title">
        <header class="main-header">
          <div>
            <h1 id="journal-title">Операции</h1>
            <p id="current-date"></p>
          </div>
          <label class="scope-picker">
            <span id="scope-color" class="account-dot" data-color="mint" aria-hidden="true"></span>
            <select id="scope" aria-label="Счёт или группа"><option value="all">Все счета</option></select>
          </label>
        </header>
        <div id="periods" class="periods" role="group" aria-label="Период">
          <button type="button" data-period="today" aria-pressed="false">Сегодня</button>
          <button type="button" data-period="yesterday" aria-pressed="false">Вчера</button>
          <button type="button" data-period="week" aria-pressed="true">Эта неделя</button>
          <button type="button" data-period="month" aria-pressed="false">Этот месяц</button>
          <button type="button" data-period="all" aria-pressed="false">Всё время</button>
        </div>
        <dl class="summary">
          <div class="summary-balance"><dt>Текущий остаток</dt><dd id="balance">0 ₽</dd></div>
          <div><dt>Доходы</dt><dd class="positive" id="income">0 ₽</dd></div>
          <div><dt>Расходы</dt><dd class="negative" id="expenses">0 ₽</dd></div>
          <div><dt>Баланс за период</dt><dd id="period-change">0 ₽</dd></div>
        </dl>
        <div class="section-heading ledger-header">
          <h2>Журнал</h2>
          <button type="button" class="text-button" id="download" hidden>Скачать копию</button>
        </div>
        <p class="empty" id="journal-empty">Нет операций за выбранный период</p>
        <div id="entries" class="entries"></div>
      </section>

      <section id="directory" aria-labelledby="directory-title" hidden>
        <header class="main-header">
          <h1 id="directory-title">Счета и категории</h1>
        </header>
        <div class="section-heading directory-heading">
          <h2>Счета</h2>
          <button type="button" class="text-button" data-add="accounts">+ Счёт</button>
        </div>
        <div class="entries" id="accounts-list"></div>
        <div class="section-heading directory-heading">
          <h2>Группы</h2>
          <button type="button" class="text-button" data-add="groups">+ Группа</button>
        </div>
        <ul class="entry-list" id="groups-list"></ul>
        <div class="section-heading directory-heading">
          <h2>Категории</h2>
          <button type="button" class="text-button" data-add="categories">+ Категория</button>
        </div>
        <div class="entries" id="categories-list"></div>
      </section>
    </main>
  </div>

  <button type="button" class="primary-button floating-add" id="show-expense" aria-label="Добавить операцию">
    <span class="icon icon-plus" aria-hidden="true"></span><span class="floating-label">Операция</span>
  </button>

  <dialog class="composer" id="operation-dialog" aria-labelledby="composer-title">
    <div class="composer-header">
      <h2 id="composer-title">Новая операция</h2>
      <button type="button" class="icon-button" data-close aria-label="Закрыть форму" autofocus>
        <span class="icon icon-close" aria-hidden="true"></span>
      </button>
    </div>
    <form id="expense-form" novalidate>
      <div id="operation-types" class="type-switch" role="group" aria-label="Вид операции">
        <button type="button" data-type="expense" aria-pressed="true">Расход</button>
        <button type="button" data-type="income" aria-pressed="false">Доход</button>
        <button type="button" data-type="transfer" aria-pressed="false">Перевод</button>
      </div>
      <div class="amount-block">
        <label for="amount">Сумма</label>
        <div class="amount-field">
          <input id="amount" type="text" inputmode="none" placeholder="0" autocomplete="off"
            aria-describedby="form-message" size="1">
          <span aria-hidden="true">₽</span>
        </div>
      </div>
      <div class="fields">
        <label class="field field-account">
          <span id="account-label">Счёт</span>
          <span class="select-wrap">
            <span id="account-dot" class="account-dot" aria-hidden="true"></span>
            <select id="account"></select>
          </span>
        </label>
        <label class="field field-date">
          <span>Дата</span>
          <input id="expense-date" type="date" min="0001-01-01" max="9999-12-31" required>
        </label>
        <label class="field field-category" id="category-field">
          <span>Категория</span>
          <span class="select-wrap"><select id="category"><option value="">Без категории</option></select></span>
        </label>
        <label class="field field-category" id="target-field" hidden>
          <span>Куда</span>
          <span class="select-wrap">
            <span id="target-dot" class="account-dot" aria-hidden="true"></span>
            <select id="target-account"></select>
          </span>
        </label>
      </div>
      <p class="message" id="form-message" role="status"></p>
      <div class="keypad" id="keypad" role="group" aria-label="Цифровая клавиатура">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="," aria-label="Запятая">,</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="backspace" aria-label="Стереть последнюю цифру">⌫</button>
      </div>
      <button class="primary-button save-button" id="save-expense" type="submit">Сохранить расход</button>
    </form>
  </dialog>

  <dialog class="composer editor" id="directory-dialog" aria-labelledby="editor-title">
    <div class="composer-header">
      <h2 id="editor-title"></h2>
      <button type="button" class="icon-button" data-close aria-label="Закрыть форму">
        <span class="icon icon-close" aria-hidden="true"></span>
      </button>
    </div>
    <form id="directory-form" novalidate>
      <label class="field"><span>Название</span><input id="record-name" type="text" maxlength="70" autocomplete="off" required autofocus></label>
      <label class="field" id="group-field">
        <span>Группа</span><span class="select-wrap"><select id="record-group"></select></span>
      </label>
      <label class="field" id="opening-field">
        <span>Начальный остаток, ₽</span><input id="record-opening" inputmode="decimal" type="text" placeholder="0">
      </label>
      <label class="field" id="record-color-field">
        <span>Цвет значка</span>
        <span class="select-wrap">
          <span id="record-color-dot" class="account-dot" aria-hidden="true"></span>
          <select id="record-color">
            <option value="mint">Мятный</option><option value="amber">Янтарный</option>
            <option value="violet">Сиреневый</option><option value="sky">Голубой</option>
            <option value="coral">Коралловый</option>
          </select>
        </span>
      </label>
      <label class="field" id="record-type-field">
        <span>Вид операции</span>
        <span class="select-wrap"><select id="record-type"><option value="expense">Расход</option><option value="income">Доход</option></select></span>
      </label>
      <p class="message" id="editor-message" role="status"></p>
      <button class="primary-button save-button" id="save-record" type="submit">Сохранить</button>
    </form>
  </dialog>
  <noscript>Включите JavaScript, чтобы записывать операции.</noscript>
</body>
</html>
